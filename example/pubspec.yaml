name: example
description: "Elattar's Design System — docs app (Flutter port of the Next.js docs site)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  elattar_design_system:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # The reference's own `public/imgs/` artwork, copied byte for byte. Only the
  # one file the corpus renders: the dialogs page's media dialog leads with
  # `<Image src="/imgs/sample-pack.jpg" fill className="object-cover">`, and a
  # `bg-muted` rectangle in its place would be a different specimen.
  assets:
    - assets/imgs/sample-pack.jpg
    # The chat page's attachment media well and its full-size preview both
    # render `<Image src="/imgs/sample-card.png">`; the well is a 102px
    # `object-cover` crop and the preview is the whole 734x1024 frame.
    - assets/imgs/sample-card.png
    # The Shot compositions, declared as assets so `/shots/<slug>` can show the
    # REAL source instead of a copy of it.
    #
    # A widget cannot read the filesystem on web or mobile, and `dart:io` paths
    # are cwd-relative besides — so the only way `ShotDetailPage.fileSource`
    # can carry the shipped bytes is for those bytes to be in the bundle.
    # Declaring the composition itself (rather than generating a Dart literal
    # from it) means the page and the registry hash read the same file: there
    # is nothing to drift.
    #
    # One directory entry per Shot, because a directory asset is non-recursive
    # and `lib/shots/` holds only sub-directories. `test/shots_catalog_parity_test.dart`
    # fails if a catalog entry has no entry here.
    - lib/shots/settings_profile/
    - lib/shots/sign_in_flow/
    - lib/shots/dashboard_overview/
  # The voice orb's fragment stage, re-declared HERE and nowhere else by
  # choice — this is the one thing a package pubspec cannot hand down.
  #
  # `fonts:` and `assets:` in a dependency's pubspec are bundled into every app
  # that depends on it (which is why the faces and the perlin field are not
  # repeated here). `shaders:` is not: flutter_tools reads it only from the ROOT
  # project, so a `shaders:` entry in `../pubspec.yaml` compiles the programme
  # for the package's OWN test bundle and never reaches this app's. Built and
  # checked: without this block `assets/packages/elattar_design_system/shaders/`
  # does not exist in `build/web`, `FragmentProgram.fromAsset` throws, and the
  # orb silently paints nothing.
  #
  # `example/shaders/orb.frag` is therefore a byte copy of the package's file,
  # not a second source: an asset path may not climb above its own project root,
  # so a relative reference is not available. `test/agent_voice_test.dart` fails if
  # the two ever differ.
  shaders:
    - shaders/orb.frag
  # Fonts are NOT re-declared here: they are registered in the package pubspec,
  # so flutter_tools bundles them for this app automatically under the family
  # name `packages/elattar_design_system/<Family>`.
