name: elattar_design_system
description: "Flutter design system package: foundation tokens, components, effects, and motion primitives, with an unprefixed public API."
version: 0.0.2
homepage: https://github.com/ELATTAR-Ayoub/flutter-design-system
repository: https://github.com/ELATTAR-Ayoub/flutter-design-system
issue_tracker: https://github.com/ELATTAR-Ayoub/flutter-design-system/issues
publish_to: 'none'

environment:
  sdk: ^3.12.2
  # The oldest Flutter this package is actually verified against, and the same
  # floor every registry manifest already declares. The default `>=1.17.0` a
  # package template ships is not a claim this package can support: the
  # foundation and the components use TextScaler, FontVariation, OverlayPortal,
  # menu anchors and RawMenuAnchor, none of which existed then.
  flutter: ">=3.44.8"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  yaml: ^3.1.2

# The following section is specific to Flutter packages.
flutter:
  # The two faces the type system ships: Inter for words, Geist Mono for code,
  # identifiers and every numeric role.
  #
  # These are declared in the PACKAGE pubspec, so flutter_tools bundles them
  # automatically for every dependent app and registers them under the prefixed
  # family name `packages/elattar_design_system/<Family>`. Call sites never see
  # that: `Fonts.package` is threaded through `TextStyle(package: ...)` inside
  # foundation/typography.dart, which performs the same prefixing.
  fonts:
    - family: InterLocal
      fonts:
        - asset: assets/fonts/InterVariable.ttf
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Variable.ttf

  # The voice orb's perlin field. `orb-vendor.tsx` edit 1 repointed upstream's
  # Google-CDN fetch at the reference's own `public/textures/perlin-noise.png`
  # so the orb renders offline; this is a byte copy of that file, bundled for
  # the same reason. Reached as
  # `packages/elattar_design_system/assets/textures/perlin-noise.png`.
  assets:
    - assets/textures/perlin-noise.png

    # The agent skill's own Markdown, declared HERE — in the package pubspec —
    # and deliberately not in `example/pubspec.yaml`.
    #
    # An asset path may not climb above its own project root, and
    # `skills/elattar-flutter-ui-director/` sits *above* `example/`, so the docs
    # app cannot declare it and a widget cannot read the filesystem on web or
    # mobile, which is where `/skills` is read. `skills/` is however inside
    # THIS package's root, and a package's assets are bundled into every app
    # that depends on it, reached as `packages/elattar_design_system/<path>`
    # (the same mechanism as the perlin field above). So the docs app renders
    # the real bytes of the one source of truth rather than a copy of them:
    # there is no second tree to regenerate and nothing that can drift.
    #
    # One entry per directory, because a directory asset is non-recursive:
    # the skill has four, and the Skills page publishes the whole tree.
    # `example/test/public_pages_test.dart` fails if any line goes missing.
    # It compares what the bundle hands the page against what is on disk.
    - skills/elattar-flutter-ui-director/
    - skills/elattar-flutter-ui-director/references/
    - skills/elattar-flutter-ui-director/scripts/
    - skills/elattar-flutter-ui-director/templates/

    # The generated registry's two catalog files, and the changelog, declared
    # here for the same reason as the skill above: both sit at the repository
    # root, above `example/`, and an asset path may not climb above its own
    # project root. Declared on the package, they reach the docs app as
    # `packages/elattar_design_system/<path>`.
    #
    # Only these three files, not the directory. `registry/generated/latest/`
    # also holds every payload the registry distributes — the whole component
    # surface, twice over — and bundling that into the web build would add
    # megabytes to serve two counts and a version string.
    - registry/generated/latest/registry.json
    - registry/generated/latest/index.json
    - CHANGELOG.md

  # The orb's fragment stage — see the header of the file itself for the five
  # edits made to the vendored GLSL and why each one was unavoidable.
  shaders:
    - shaders/orb.frag
