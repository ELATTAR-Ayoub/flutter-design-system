include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Nested packages and generated registry payloads have their own analysis
    # contexts. Generated items are intentionally partial dependency units.
    - packages/**
    - registry/generated/**
    - tool/registry_builder/**
    - tool/generate_perlin_texture/**
    - tool/release_registry/**
    - tool/release_audit/**
    - test/project_config_test.dart
    - test/registry_builder_test.dart
    - test/registry_client_test.dart
    - test/license_distribution_test.dart

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
