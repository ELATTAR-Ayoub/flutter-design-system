# Deploy manually when rehearsing a release, and automatically only after CI
# completes successfully on main. The workflow-run gate prevents a push from
# publishing a site that failed the repository, registry, CLI, or web checks.
name: Deploy Docs

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      stage_registry:
        description: >-
          Stage the generated registry at /registry/<version>/ in the artifact.
        type: boolean
        default: true
      registry_version:
        description: The immutable registry version to publish; blank uses the current CLI version.
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install package dependencies
        run: flutter pub get

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Analyze package
        run: flutter analyze

      - name: Test package
        run: flutter test --reporter expanded

      - name: Analyze example
        working-directory: example
        run: flutter analyze

      - name: Test example
        working-directory: example
        run: flutter test --reporter expanded

      - name: Build example web release
        working-directory: example
        run: flutter build web --release --base-href /flutter-design-system/

      - name: Resolve registry version
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.registry_version }}
        run: |
          current_version="$(sed -n "s/^const String cliVersion = '\([^']*\)';$/\1/p" packages/elattar_cli/lib/src/identity.dart)"
          test -n "$current_version"
          echo "version=${INPUT_VERSION:-$current_version}" >> "$GITHUB_OUTPUT"

      # The registry is staged INTO the built site, so the CLI's default
      # registry URL and the documentation share one origin and one
      # deployment. Staging after the build is deliberate: `flutter build web`
      # clears its output directory, so anything staged first would be erased.
      #
      # `stage.dart` refuses to overwrite an already-published version with
      # different bytes. That refusal is the whole guarantee behind the CLI
      # pinning `/registry/<version>/` — a released CLI must not start installing
      # different sources because a later deploy reused the path.
      - name: Stage the versioned registry
        if: ${{ github.event_name == 'workflow_run' || inputs.stage_registry }}
        run: >-
          dart run tool/release_registry/bin/stage.dart
          --version ${{ steps.release.outputs.version }}
          --web-root example/build/web
          --commit ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Show what will be published
        if: ${{ github.event_name == 'workflow_run' || inputs.stage_registry }}
        run: cat example/build/web/registry/${{ steps.release.outputs.version }}/release.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: example/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
