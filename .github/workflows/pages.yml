# GATED. Deployment is manual until the release gates below are closed.
#
# The original `push: branches: [main]` trigger was removed during the Phase I
# audit because one merge would have published, publicly and simultaneously,
# every blocker that audit found. Most of them are now closed — see
# `docs/superpowers/reports/public-release/v0.0.1-public-release-baseline.md`,
# which classifies each one against the commit it was fixed in rather than
# repeating the original list.
#
# Closed since the gate was written: the placeholder LICENSE (a real MIT
# license with the confirmed copyright line), the three unlicensed font
# binaries, the unattributed Lucide geometry, the unattributed shader, the
# texture of unknown provenance (regenerated deterministically), the broken
# quickstart command, the false "OPEN SOURCE" badge, and the developer toast
# shipped to public readers.
#
# STILL OPEN, and each one blocks restoring an automatic trigger:
#
#   1. The repository is not public. Every registry `sourceLink`, every plugin
#      install command on /skills, and every clone URL in the docs is a 404 to
#      an anonymous reader, so deploying now publishes a site whose links do
#      not work.
#   2. `main` does not contain this branch. All 99 `sourceLink` values target
#      `blob/main/...`; publishing before that merge ships 99 dead links even
#      once the repository is public.
#   3. The /skills page still publishes GitHub-form plugin install commands
#      against that unreachable repository.
#   4. Docs routing is incomplete: five of the seven /docs guide cards still
#      navigate to the homepage, and three declared routes have no page.
#
# Until then: Actions -> "Deploy Docs" -> "Run workflow", deliberately.
name: Deploy Docs

on:
  workflow_dispatch:
    inputs:
      stage_registry:
        description: >-
          Stage the generated registry at /registry/<version>/ in the artifact.
        type: boolean
        default: true
      registry_version:
        description: The immutable registry version to publish.
        type: string
        default: 0.0.1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install package dependencies
        run: flutter pub get

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Analyze package
        run: flutter analyze

      - name: Test package
        run: flutter test --reporter expanded

      - name: Analyze example
        working-directory: example
        run: flutter analyze

      - name: Test example
        working-directory: example
        run: flutter test --reporter expanded

      - name: Build example web release
        working-directory: example
        run: flutter build web --release --base-href /flutter-design-system/

      # The registry is staged INTO the built site, so the CLI's default
      # registry URL and the documentation share one origin and one
      # deployment. Staging after the build is deliberate: `flutter build web`
      # clears its output directory, so anything staged first would be erased.
      #
      # `stage.dart` refuses to overwrite an already-published version with
      # different bytes. That refusal is the whole guarantee behind the CLI
      # pinning `/registry/0.0.1/` — a released CLI must not start installing
      # different sources because a later deploy reused the path.
      - name: Stage the versioned registry
        if: ${{ inputs.stage_registry }}
        run: >-
          dart run tool/release_registry/bin/stage.dart
          --version ${{ inputs.registry_version }}
          --web-root example/build/web
          --commit ${{ github.sha }}

      - name: Show what will be published
        if: ${{ inputs.stage_registry }}
        run: cat example/build/web/registry/${{ inputs.registry_version }}/release.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: example/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
