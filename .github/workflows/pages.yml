# GATED (Phase I, F27 — see docs/superpowers/reports/public-release/phase-i-audit-findings.md).
#
# The automatic `push: branches: [main]` trigger was removed because a single
# merge to main would publish, simultaneously and publicly, every blocker that
# audit records: a NOTICES file whose license notice is the literal string
# "TODO: Add your license here." (F1); three SIL OFL fonts (Inter, Geist Mono,
# Redaction 35) redistributed with no license text (F2); unattributed Lucide
# icon geometry (F3), an unattributed MIT shader (F4), and a texture of
# unknown provenance (F5); a homepage "OPEN SOURCE" badge that is false while
# LICENSE is a placeholder (F11); a quickstart command that cannot work for
# any reader (F8); and a developer-only toast string aimed at public readers
# (F13).
#
# Do not restore the `push` trigger until ALL of the following are closed:
#   - F1/F2/F3/F4/F5 (licensing owner decisions — a real LICENSE is chosen,
#     the OFL notices are bundled, and the Lucide/orb/texture provenance is
#     resolved or the assets are replaced)
#   - F8 (the broken `dart run elattar_cli init` quickstart command)
#   - F11 (the false "OPEN SOURCE" badge)
#   - F13 (the developer toast string reachable by public readers)
# F9/F10/F14/F15 are the same audit's site-copy findings and should be closed
# before re-gating too, even though they are not independently blocking.
#
# Until then, deploy manually and deliberately: Actions tab -> "Deploy Docs"
# -> "Run workflow".
name: Deploy Docs

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install package dependencies
        run: flutter pub get

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Analyze package
        run: flutter analyze

      - name: Test package
        run: flutter test --reporter expanded

      - name: Analyze example
        working-directory: example
        run: flutter analyze

      - name: Test example
        working-directory: example
        run: flutter test --reporter expanded

      - name: Build example web release
        working-directory: example
        run: flutter build web --release --base-href /flutter-design-system/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: example/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
